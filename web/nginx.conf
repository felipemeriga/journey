server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Astro builds with directory format: /blog/ -> /blog/index.html
    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    # hashed, immutable build assets
    location /_astro/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # other static assets
    location ~* \.(css|js|jpg|jpeg|png|svg|webp|woff2?|pdf|ico|xml)$ {
        expires 30d;
        add_header Cache-Control "public";
    }

    error_page 404 /404.html;
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/rss+xml application/xml;
    gzip_min_length 1024;
}
